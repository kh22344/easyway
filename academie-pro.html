<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'Académie Pro | Learn French with Rayan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&family=Noto+Sans+SC:wght@500;700&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root{
  --green:#58cc02;--green-d:#46a302;--blue:#1cb0f6;--blue-d:#1899d6;--red:#ff4b4b;--red-d:#d43f3f;
  --gold:#ffc800;--gold-d:#c79c00;--purple:#ce82ff;--bg:#0b1220;--card:rgba(24,34,54,.92);--line:rgba(255,255,255,.10);
  --text:#f4f7fb;--muted:#93a3ba;--font:'Plus Jakarta Sans','Noto Sans SC','Noto Sans Devanagari',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
[dir="rtl"]{--font:'Cairo','Plus Jakarta Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font)}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;color:var(--text);display:flex;flex-direction:column;overflow-x:hidden;
  background:radial-gradient(1200px 700px at 15% -10%,#1e2a5a 0%,transparent 60%),radial-gradient(900px 600px at 100% 10%,#3a1450 0%,transparent 55%),var(--bg);
  background-attachment:fixed}
button{cursor:pointer;color:inherit;font:inherit;border:none;background:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}

/* 3D floating background */
#bg3d{position:fixed;inset:0;pointer-events:none;perspective:900px;z-index:0;overflow:hidden}
#bg3d .layer{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .25s ease-out}
.shp{position:absolute;opacity:.10;font-weight:800;color:#fff;animation:floaty var(--d) ease-in-out infinite alternate;will-change:transform}
@keyframes floaty{from{transform:translate3d(0,0,var(--z)) rotateX(0) rotateY(0) rotateZ(0)}to{transform:translate3d(40px,-70px,var(--z)) rotateX(160deg) rotateY(200deg) rotateZ(40deg)}}

/* Header */
header{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:1rem;
  padding:.8rem clamp(1rem,3vw,2rem);background:rgba(11,18,32,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);animation:dropIn .7s var(--ease) backwards}
@keyframes dropIn{from{transform:translateY(-100%);opacity:0}to{transform:none;opacity:1}}
.logo{display:flex;align-items:center;gap:.55rem;font-weight:800;font-size:1.15rem;color:var(--green)}
.logo i{font-style:normal;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--green),#2f9e00);color:#fff;box-shadow:0 3px 0 var(--green-d);animation:logoSpin 6s var(--ease) infinite}
@keyframes logoSpin{0%,80%,100%{transform:rotateY(0)}90%{transform:rotateY(360deg)}}
.stats{display:flex;align-items:center;gap:.4rem}
.stat{display:flex;align-items:center;gap:.35rem;padding:.4rem .75rem;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:800;font-size:.95rem}
.stat.s{color:var(--gold)}.stat.x{color:var(--blue)}.stat.h{color:var(--red)}
.stat.s .fl{display:inline-block;animation:flame 1.2s ease-in-out infinite alternate;transform-origin:50% 90%}
@keyframes flame{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.18) rotate(5deg)}}
.stat.low .hr{display:inline-block;animation:beat .8s infinite}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.3)}60%{transform:scale(1)}}
.stat.bump{animation:bump .5s var(--ease)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.3) rotateX(30deg)}100%{transform:scale(1)}}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:1.05rem;transition:.15s}
.icon-btn:hover{background:rgba(255,255,255,.12);transform:rotate(15deg) scale(1.08)}

/* Layout */
.wrap{position:relative;z-index:1;width:100%;max-width:1100px;margin:0 auto;padding:1.5rem clamp(1rem,3vw,2rem) 3rem;display:grid;grid-template-columns:320px 1fr;gap:1.75rem;flex:1;animation:pageIn .9s var(--ease) backwards}
@keyframes pageIn{from{opacity:0;transform:perspective(1200px) rotateX(10deg) translateY(40px)}to{opacity:1;transform:none}}
@media(max-width:860px){.wrap{grid-template-columns:1fr}.side{position:static!important}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:1.5rem;box-shadow:0 20px 40px -20px rgba(0,0,0,.6)}
.side{padding:1.25rem;display:flex;flex-direction:column;align-items:center;text-align:center;height:fit-content;position:sticky;top:84px;animation:slideSide .9s var(--ease) .1s backwards}
@keyframes slideSide{from{opacity:0;transform:perspective(900px) rotateY(-25deg) translateX(-40px)}to{opacity:1;transform:none}}
[dir="rtl"] .side{animation-name:slideSideR}
@keyframes slideSideR{from{opacity:0;transform:perspective(900px) rotateY(25deg) translateX(40px)}to{opacity:1;transform:none}}
#mascot{width:220px;height:220px;cursor:pointer;display:grid;place-items:center;font-size:6rem}
#mascot canvas{display:block;max-width:100%;height:auto!important}
.side h3{font-weight:800;font-size:1.3rem;color:var(--green)}
.side small{color:var(--muted);font-size:.8rem}
.bubble{position:relative;margin-top:1rem;width:100%;background:#fff;color:#0f172a;padding:.95rem 1rem;border-radius:1.1rem;font-weight:700;font-size:.93rem;line-height:1.45;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.bubble.pop{animation:bubblePop .45s var(--ease)}
@keyframes bubblePop{from{transform:perspective(500px) rotateX(-40deg) scale(.9);opacity:.2}to{transform:none;opacity:1}}
.bubble::before{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%);border:0 solid transparent;border-width:0 9px 9px;border-bottom-color:#fff}

/* Track card */
.track{padding:1.1rem 1.3rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.25rem;flex-wrap:wrap;animation:pageIn .9s var(--ease) .15s backwards}
.track h2{font-size:1.25rem;font-weight:800;color:var(--blue)}
.track p{font-size:.85rem;color:var(--muted);margin-top:.15rem}
.meter{height:10px;width:200px;max-width:100%;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:.55rem}
.meter b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#9be22d);border-radius:99px;transition:width .8s var(--ease)}
.chip-btn{padding:.55rem 1rem;border-radius:.8rem;border:2px solid var(--line);font-weight:700;font-size:.85rem;transition:.15s}
.chip-btn:hover{border-color:var(--blue);background:rgba(28,176,246,.1);transform:translateY(-2px)}

/* Path */
.path{display:flex;flex-direction:column;align-items:center;gap:2.2rem;padding:1rem 0 2rem;perspective:1000px}
.nodewrap{transition:transform .3s}
.node{--rx:0deg;--ry:0deg;--s:1;position:relative;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.5rem;color:#fff;
  background:var(--green);border:4px solid rgba(255,255,255,.9);box-shadow:0 8px 0 var(--green-d),0 14px 24px rgba(0,0,0,.4);
  transform:perspective(500px) rotateX(var(--rx)) rotateY(var(--ry)) scale(var(--s));transition:transform .12s,box-shadow .12s;
  animation:nodeIn .7s var(--ease) backwards;animation-delay:calc(var(--i)*90ms + .3s)}
@keyframes nodeIn{from{opacity:0;transform:perspective(500px) translateZ(-300px) rotateX(70deg) scale(.4)}to{opacity:1}}
.node:hover:not(:disabled){--s:1.08}
.node:active:not(:disabled){--s:.96;box-shadow:0 3px 0 var(--green-d)}
.node.done{background:var(--gold);box-shadow:0 8px 0 var(--gold-d),0 14px 24px rgba(0,0,0,.4)}
.node.done span{display:inline-block;animation:coin 4s ease-in-out infinite}
@keyframes coin{0%,70%,100%{transform:rotateY(0)}85%{transform:rotateY(360deg)}}
.node.locked{background:#4b5a72;box-shadow:0 8px 0 #263248;border-color:rgba(255,255,255,.3);cursor:not-allowed;opacity:.7}
.node.current{animation:nodeIn .7s var(--ease) backwards,pulse 1.8s .9s infinite,bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -8px}}
@keyframes pulse{0%,100%{box-shadow:0 8px 0 var(--green-d),0 0 0 0 rgba(88,204,2,.55)}50%{box-shadow:0 8px 0 var(--green-d),0 0 0 18px rgba(88,204,2,0)}}
.node em{position:absolute;top:calc(100% + 12px);font-style:normal;font-size:.72rem;font-weight:700;white-space:nowrap;padding:.15rem .6rem;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted)}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:200;display:flex;justify-content:center;align-items:center;padding:1rem;background:rgba(6,10,20,.88);backdrop-filter:blur(16px);animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:520px;padding:2rem;text-align:center;animation:pop .5s var(--ease)}
@keyframes pop{from{transform:perspective(900px) rotateX(28deg) translateY(30px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.flip3d{animation:flipIn .7s var(--ease)}
@keyframes flipIn{from{transform:perspective(1000px) rotateY(-90deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-size:1.65rem;font-weight:800;color:var(--green);margin-bottom:.4rem}
.modal p{color:var(--muted);font-size:.93rem;margin-bottom:1.4rem;line-height:1.5}
.field{text-align:start;margin-bottom:1.1rem}
.field label{display:block;font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
.field select{width:100%;padding:.85rem 1rem;border-radius:.85rem;background:#0e1626;color:var(--text);border:2px solid var(--line);font-size:1rem}
.field select:focus{border-color:var(--green);outline:none}
.btn{display:block;width:100%;padding:.95rem 1.5rem;border-radius:1rem;font-weight:800;font-size:1rem;letter-spacing:.02em;text-transform:uppercase;color:#fff;background:var(--green);box-shadow:0 5px 0 var(--green-d);transition:.08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--green-d)}
.btn:disabled{background:#3a4658;box-shadow:0 5px 0 #28323f;color:#8392a8;cursor:not-allowed}
.btn.red{background:var(--red);box-shadow:0 5px 0 var(--red-d)}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 var(--blue-d)}
.btn+.btn{margin-top:.8rem}
.closex{position:absolute;top:.8rem;inset-inline-end:1rem;font-size:1.3rem;color:var(--muted);padding:.3rem .5rem}
.closex:hover{color:var(--text)}

/* Mode picker */
.picker{position:relative;width:100%;max-width:860px;padding:1.8rem;animation:pop .5s var(--ease)}
.picker h2{font-size:1.6rem;font-weight:800;color:var(--green)}
.picker p{color:var(--muted);font-size:.9rem;margin:.3rem 0 1.3rem}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1rem;perspective:1100px}
.mode{--rx:0deg;--ry:0deg;position:relative;text-align:start;padding:1.1rem;border-radius:1.2rem;border:2px solid var(--line);border-bottom-width:6px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  transform:perspective(800px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .12s,border-color .2s,background .2s;transform-style:preserve-3d;
  animation:modeIn .65s var(--ease) backwards;animation-delay:calc(var(--i)*70ms)}
@keyframes modeIn{from{opacity:0;transform:perspective(800px) rotateY(-80deg) translateZ(-120px)}to{opacity:1}}
.mode:hover{border-color:var(--c,var(--blue));background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03))}
.mode .ico{display:block;font-size:2.2rem;margin-bottom:.4rem;transform:translateZ(40px);filter:drop-shadow(0 8px 6px rgba(0,0,0,.4));transition:transform .3s var(--ease)}
.mode:hover .ico{transform:translateZ(60px) scale(1.15) rotate(-6deg)}
.mode b{display:block;font-size:1.02rem;font-weight:800;transform:translateZ(25px)}
.mode small{display:block;color:var(--muted);font-size:.8rem;line-height:1.4;margin-top:.2rem}
.mode .badge{position:absolute;top:.7rem;inset-inline-end:.7rem;font-size:.65rem;font-weight:800;text-transform:uppercase;padding:.15rem .5rem;border-radius:99px;background:rgba(88,204,2,.2);color:var(--green)}
.mode .badge.done{background:rgba(255,200,0,.2);color:var(--gold)}

/* Lesson / practice shell */
#lesson,#prac{z-index:150;background:var(--bg);flex-direction:column;justify-content:flex-start;align-items:stretch;padding:0;backdrop-filter:none;animation:shellIn .6s var(--ease)}
@keyframes shellIn{from{opacity:0;transform:perspective(1400px) rotateX(14deg) translateY(60px) scale(.94)}to{opacity:1;transform:none}}
.lbar{display:flex;align-items:center;gap:1rem;padding:1rem clamp(1rem,4vw,2rem);max-width:820px;width:100%;margin:0 auto}
.lbar .x{font-size:1.3rem;color:var(--muted);padding:.3rem .5rem}
.lbar .x:hover{color:var(--text)}
.pbar{flex:1;height:16px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.pbar b{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .5s var(--ease);position:relative}
.pbar b::after{content:'';position:absolute;inset:4px 8px auto;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
.lbody{flex:1;overflow:auto;max-width:820px;width:100%;margin:0 auto;padding:1rem clamp(1rem,4vw,2rem) 2rem;perspective:1400px}
.qenter{animation:qEnter .6s var(--ease)}
@keyframes qEnter{from{opacity:0;transform:rotateY(-40deg) translateX(80px) translateZ(-200px)}to{opacity:1;transform:none}}
.tag{display:inline-block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;padding:.3rem .75rem;border-radius:99px;background:rgba(28,176,246,.18);color:var(--blue);margin-bottom:.8rem}
.qtitle{font-size:clamp(1.2rem,3vw,1.6rem);font-weight:800;margin-bottom:1rem}
.prompt{display:flex;align-items:center;gap:.9rem;padding:1.1rem 1.25rem;border-radius:1.2rem;border:2px solid var(--line);background:rgba(255,255,255,.03);font-size:clamp(1.1rem,3vw,1.5rem);font-weight:700;margin-bottom:1.4rem}
.say{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;background:rgba(28,176,246,.18);border:2px solid var(--blue);transition:.15s}
.say:hover{transform:scale(1.1) rotate(-8deg)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:.8rem;padding:1rem 1.1rem;border-radius:1rem;border:2px solid var(--line);border-bottom-width:5px;background:rgba(255,255,255,.03);font-weight:700;font-size:1.05rem;text-align:start;transition:.12s;animation:optIn .5s var(--ease) backwards;animation-delay:calc(var(--i)*70ms + .15s)}
@keyframes optIn{from{opacity:0;transform:perspective(600px) rotateX(-50deg) translateY(20px)}to{opacity:1}}
.opt kbd{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--muted);font-family:inherit}
.opt:hover:not(:disabled){background:rgba(28,176,246,.08);border-color:rgba(28,176,246,.5);transform:translateY(-2px)}
.opt.sel{border-color:var(--blue);background:rgba(28,176,246,.18)}
.opt.ok{border-color:var(--green);background:rgba(88,204,2,.18);animation:okPop .5s var(--ease)}
.opt.no{border-color:var(--red);background:rgba(255,75,75,.15);animation:shake .4s}
@keyframes okPop{0%{transform:scale(1)}40%{transform:perspective(500px) scale(1.06) rotateX(12deg)}100%{transform:scale(1)}}
.opt:disabled{cursor:default}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--blue);text-align:center;padding:0 .4rem;color:var(--blue)}
.slot{min-height:76px;display:flex;flex-wrap:wrap;gap:.55rem;align-items:center;padding:.8rem 0;margin-bottom:1rem;border-top:2px solid var(--line);border-bottom:2px solid var(--line);background:repeating-linear-gradient(transparent,transparent 62px,var(--line) 62px,var(--line) 64px)}
.bank{display:flex;flex-wrap:wrap;gap:.55rem;justify-content:center}
.wchip{padding:.65rem 1rem;border-radius:.85rem;border:2px solid var(--line);border-bottom-width:5px;background:#16213a;font-weight:700;font-size:1rem;transition:.1s;animation:chipIn .35s var(--ease)}
@keyframes chipIn{from{opacity:0;transform:translateY(-14px) scale(.8)}to{opacity:1}}
.wchip:hover:not(:disabled){border-color:var(--blue);transform:translateY(-2px)}
.wchip.ghost{opacity:.15;pointer-events:none;animation:none}
.wchip:disabled{cursor:default}
.lfoot{border-top:2px solid var(--line);padding:1rem clamp(1rem,4vw,2rem);transition:background .2s}
.lfoot .in{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.lfoot .msg{flex:1;min-width:0}
.lfoot .msg strong{display:block;font-size:1.2rem;font-weight:800}
.lfoot .msg span{display:block;font-size:.92rem;margin-top:.15rem;word-break:break-word}
.lfoot .btn{width:auto;min-width:170px}
.lfoot.ok{background:rgba(88,204,2,.14);color:#b8f27a}
.lfoot.no{background:rgba(255,75,75,.14);color:#ffb0b0}
.lfoot.ok,.lfoot.no{animation:footUp .4s var(--ease)}
@keyframes footUp{from{transform:translateY(60px);opacity:.3}to{transform:none;opacity:1}}
.lfoot.no .btn{background:var(--red);box-shadow:0 5px 0 var(--red-d)}
@media(max-width:560px){.lfoot .in{flex-direction:column;align-items:stretch}.lfoot .btn{width:100%}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* New question types */
.listenbig{display:flex;gap:1rem;justify-content:center;align-items:center;margin:.5rem 0 1.6rem}
.bigsay{width:110px;height:110px;border-radius:50%;font-size:2.6rem;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),#0f7fc0);box-shadow:0 8px 0 var(--blue-d),0 0 0 0 rgba(28,176,246,.5);animation:ripple 2s infinite;transition:transform .1s}
.bigsay:active{transform:translateY(4px);box-shadow:0 3px 0 var(--blue-d)}
@keyframes ripple{0%{box-shadow:0 8px 0 var(--blue-d),0 0 0 0 rgba(28,176,246,.5)}100%{box-shadow:0 8px 0 var(--blue-d),0 0 0 36px rgba(28,176,246,0)}}
.slow{width:56px;height:56px;border-radius:50%;font-size:1.5rem;display:grid;place-items:center;background:rgba(255,255,255,.07);border:2px solid var(--line)}
.tin{width:100%;padding:1rem 1.2rem;border-radius:1rem;border:2px solid var(--line);background:#0e1626;color:var(--text);font-size:1.25rem;font-weight:700;transition:border-color .2s,box-shadow .2s}
.tin:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(28,176,246,.2);outline:none}
.accents{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.8rem}
.accents button{width:42px;height:42px;border-radius:.7rem;border:2px solid var(--line);border-bottom-width:4px;font-weight:800;font-size:1.05rem;background:#16213a;transition:.1s}
.accents button:hover{border-color:var(--purple);transform:translateY(-2px)}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:1rem;margin-top:.5rem}
.mic{width:96px;height:96px;border-radius:50%;font-size:2.4rem;display:grid;place-items:center;background:linear-gradient(135deg,var(--purple),#8a3fd1);box-shadow:0 7px 0 #6a2ca3;transition:transform .1s}
.mic:active{transform:translateY(4px)}
.mic.on{animation:micPulse 1s infinite;background:linear-gradient(135deg,var(--red),#c22)}
@keyframes micPulse{0%{box-shadow:0 7px 0 #8d1f1f,0 0 0 0 rgba(255,75,75,.6)}100%{box-shadow:0 7px 0 #8d1f1f,0 0 0 34px rgba(255,75,75,0)}}
.heard{min-height:1.6rem;color:var(--muted);font-weight:700;text-align:center}

/* Flashcards (3D flip) */
.pstage{perspective:1400px;display:flex;flex-direction:column;align-items:center;gap:1.4rem}
.scene3d{width:min(420px,100%);height:260px;perspective:1200px;animation:cardIn .7s var(--ease)}
@keyframes cardIn{from{opacity:0;transform:rotateY(-80deg) translateX(120px) translateZ(-200px)}to{opacity:1;transform:none}}
.scene3d.out-ok{animation:outOk .5s var(--ease) forwards}
.scene3d.out-no{animation:outNo .5s var(--ease) forwards}
@keyframes outOk{to{opacity:0;transform:translateX(120%) rotateY(55deg) rotateZ(14deg)}}
@keyframes outNo{to{opacity:0;transform:translateX(-120%) rotateY(-55deg) rotateZ(-14deg)}}
.fcard{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s var(--ease);cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.fcard:hover:not(.flip){transform:rotateY(-8deg) rotateX(4deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:1.6rem;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;padding:1.5rem;text-align:center;font-size:clamp(1.4rem,4vw,2rem);font-weight:800;box-shadow:0 24px 40px -18px rgba(0,0,0,.7)}
.face.f{background:linear-gradient(145deg,#22407a,#2b2260)}
.face.b{background:linear-gradient(145deg,#1d5a3a,#1b3d5c);transform:rotateY(180deg)}
.face small{font-size:.8rem;color:rgba(255,255,255,.6);font-weight:600}
.frow{display:flex;gap:1rem;width:min(420px,100%)}
.frow .btn{flex:1}
.hint{color:var(--muted);font-size:.85rem;font-weight:600}

/* Memory */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.8rem;width:100%;perspective:1400px}
.tile{aspect-ratio:4/3;perspective:800px;cursor:pointer;animation:tileIn .6s var(--ease) backwards;animation-delay:calc(var(--i)*50ms)}
@keyframes tileIn{from{opacity:0;transform:rotateX(90deg) translateY(30px)}to{opacity:1}}
.tinner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s var(--ease)}
.tile.open .tinner,.tile.done .tinner{transform:rotateY(180deg)}
.tile:hover:not(.open):not(.done) .tinner{transform:rotateY(-14deg) translateZ(10px)}
.tf,.tb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:1rem;display:grid;place-items:center;padding:.5rem;text-align:center;font-weight:700;border:2px solid var(--line)}
.tf{background:linear-gradient(135deg,#1c2b4d,#2a1a4a);font-size:2rem}
.tb{transform:rotateY(180deg);background:#16213a;font-size:.95rem;line-height:1.3}
.tile.done .tb{border-color:var(--green);background:rgba(88,204,2,.18);box-shadow:0 0 26px rgba(88,204,2,.4)}
.tile.done{animation:matchPop .6s var(--ease)}
@keyframes matchPop{40%{transform:scale(1.1) translateZ(30px)}}
.tile.bad .tb{border-color:var(--red)}
.minfo{display:flex;gap:1.2rem;color:var(--muted);font-weight:700;margin-bottom:1rem}

/* Speed */
.timer{height:12px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;width:100%;margin-bottom:1.2rem}
.timer b{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--red));transform-origin:left}
.sbig{font-size:2.4rem;font-weight:800;color:var(--gold)}

/* Result */
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin:1.2rem 0 1.6rem}
.result-grid div{padding:.9rem;border-radius:1rem;border:2px solid var(--line);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;animation:cardIn .7s var(--ease) backwards}
.result-grid div:nth-child(2){animation-delay:.15s}
.result-grid b{display:block;font-size:1.7rem;margin-top:.2rem;letter-spacing:0}
.big-emoji{font-size:3.6rem;margin-bottom:.4rem;display:inline-block;animation:trophy 1.4s var(--ease)}
@keyframes trophy{0%{transform:rotateY(0) scale(.3)}60%{transform:rotateY(540deg) scale(1.3)}100%{transform:rotateY(720deg) scale(1)}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

let AC;
function sfx(k){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const seq={ok:[[660,.09],[880,.14]],no:[[220,.16],[170,.22]],flip:[[520,.05],[620,.04]],win:[[523,.1],[659,.1],[784,.1],[1047,.28]]}[k];
    let t0=AC.currentTime;
    seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=k==="no"?"sawtooth":"sine";o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.1,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
      o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.02);t0+=d*.9});
  }catch(e){}
}

/* ============ Map ============ */
function tilt(e,max){
  e.addEventListener("pointermove",ev=>{const r=e.getBoundingClientRect();const x=(ev.clientX-r.left)/r.width-.5,y=(ev.clientY-r.top)/r.height-.5;
    e.style.setProperty("--ry",(x*max*2).toFixed(1)+"deg");e.style.setProperty("--rx",(-y*max*2).toFixed(1)+"deg")});
  e.addEventListener("pointerleave",()=>{e.style.setProperty("--rx","0deg");e.style.setProperty("--ry","0deg")});
}
function renderMap(){
  if(!S.track)return;
  const done=S.done[S.track];
  $("trackTitle").textContent=`${S.track} · ${t("track")}`;
  $("trackDesc").textContent=`${done}/${STAGES} ${t("stages")} · ${t("trackDesc")}`;
  $("trackMeter").style.width=(done/STAGES*100)+"%";
  const p=$("path");p.innerHTML="";
  const dir=S.lang==="ar"?-1:1;
  for(let i=1;i<=STAGES;i++){
    const state=i<=done?"done":(i===done+1?"current":"locked");
    const w=el("div","nodewrap");w.style.transform=`translateX(${Math.round(Math.sin(i*1.3)*60*dir)}px)`;
    const b=el("button",`node ${state}`);b.style.setProperty("--i",i);
    b.disabled=state==="locked";b.setAttribute("aria-label",`${t("stage")} ${i}`);
    b.append(el("span","",state==="done"?"✓":state==="locked"?"🔒":String(i)),el("em","",`${t("stage")} ${i}`));
    if(state!=="locked"){b.onclick=()=>openPicker(i);tilt(b,16)}
    w.appendChild(b);p.appendChild(w);
  }
}

function makeBg(){
  const L=$("bgLayer"),chars=["⚜","é","à","ç","œ","ê","ù","«","»","ô","î","?","!","✦"];
  for(let i=0;i<18;i++){
    const s=el("span","shp",chars[i%chars.length]);
    s.style.left=(Math.random()*95)+"%";s.style.top=(Math.random()*95)+"%";
    s.style.fontSize=(30+Math.random()*80)+"px";
    s.style.setProperty("--z",(-300+Math.random()*500)+"px");
    s.style.setProperty("--d",(8+Math.random()*10)+"s");
    s.style.animationDelay=(-Math.random()*10)+"s";
    L.appendChild(s);
  }
  window.addEventListener("pointermove",e=>{
    const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;
    L.style.transform=`rotateY(${x*10}deg) rotateX(${-y*10}deg)`;
  });
}

let L=null;
function buildQ(it,pool,kind){
  const [en,ar]=mnArr(it),ans=frText(it);
  if(kind==="listen"){
    const wrong=shuffle(pool.map(frText).filter(x=>x!==ans)).slice(0,3);
    return{type:"l",answer:ans,speak:ans,en,ar,options:shuffle([ans,...wrong])};
  }
  if(kind==="type")return{type:"t",answer:ans,speak:ans,en,ar};
  if(kind==="speak")return{type:"s",answer:ans,speak:ans,en,ar};
  if(it[0]==="v"){
    const wrong=shuffle(pool.filter(p=>p[0]==="v"&&p[1]!==it[1]).map(p=>p[1])).slice(0,3);
    return{type:"v",answer:it[1],speak:it[1],en,ar,options:shuffle([it[1],...wrong])};
  }
  if(it[0]==="g")return{type:"g",sentence:it[1],answer:it[2],speak:ans,options:shuffle(it[3].split("|")),en,ar};
  const words=[...it[1].split(" "),...it[4].split("|")].map((w,i)=>({w,id:i}));
  return{type:"b",answer:it[1],speak:it[1],en,ar,bank:shuffle(words),placed:[]};
}

function micFail(msg){

function startMic(q){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){micFail();return}
  if(L.rec){try{L.rec.abort()}catch(e){}}
  if("speechSynthesis"in window)speechSynthesis.cancel();
  const r=new SR();L.rec=r;r.lang="fr-FR";r.maxAlternatives=3;r.interimResults=false;
  $("micBtn").classList.add("on");$("heard").textContent=t("micOn");
  r.onresult=e=>{
    const alts=[...e.results[0]].map(x=>x.transcript);let best=alts[0],bs=-1;
    alts.forEach(x=>{const s=sim(x,q.answer);if(s>bs){bs=s;best=x}});
    L.sel=best;L.score=bs;L.canSkip=false;
    $("heard").textContent=t("heard")+" "+best;
    const m=$("btnMain");m.textContent=t("check");m.disabled=false;
  };
  r.onerror=e=>{if(e.error==="no-speech"){$("heard").textContent=t("micTap");$("micBtn").classList.remove("on")}else micFail()};
  r.onend=()=>{const mb=$("micBtn");if(mb)mb.classList.remove("on")};

function checkAnswer(){
  const q=L.q;let ok,note="";
  if(q.type==="b")ok=norm(q.placed.map(c=>c.w).join(" "))===norm(q.answer);
  else if(q.type==="t"){
    ok=norm(L.sel)===norm(q.answer);
    if(!ok&&strip(L.sel)===strip(q.answer)){ok=true;note=t("accents")+" "+q.answer}
    $("tin").disabled=true;
  }else if(q.type==="s")ok=L.score>=.72;
  else ok=L.sel===q.answer;
  L.phase="feedback";
  $("foot").className="lfoot "+(ok?"ok":"no");
  const fm=$("footMsg");fm.innerHTML="";
  fm.appendChild(el("strong","",ok?t("right"):t("answer")));
  if(!ok)fm.appendChild(el("span","",q.type==="g"?q.sentence.replace("___",q.answer):q.answer));
  if(ok&&note)fm.appendChild(el("span","",note));
  if(q.type==="s"&&L.sel)fm.appendChild(el("span","",t("heard")+" "+L.sel));
  if(q.options){
    document.querySelectorAll("#opts .opt").forEach(b=>{
      const v=b.querySelector("span").textContent;b.disabled=true;
      if(v===q.answer)b.classList.add("ok");else if(v===L.sel)b.classList.add("no");
    });

  }else if(q.type==="b")document.querySelectorAll("#bank .wchip").forEach(b=>b.disabled=true);
  if(ok){
    L.right++;L.xp+=10;S.xp+=10;happy();setBubble(t("good"));sfx("ok");
    $("lessonBar").style.width=(L.right/Math.max(1,L.total)*100)+"%";
    confetti({particleCount:40,spread:60,origin:{y:.85},disableForReducedMotion:true});
  }else{
    L.wrong++;sad();setBubble(t("bad"));sfx("no");
    if(!L.practice)S.hearts=Math.max(0,S.hearts-1);
    restart($("qArea"),"shake");
    q.tries=(q.tries||0)+1;
    if(!L.practice||q.tries<2){
      const again=Object.assign({},q);
      if(again.type==="b"){again.placed=[];again.bank=shuffle(again.bank)}

      if(P.matched===P.pairs){
        const moves=P.moves,secs=Math.round((Date.now()-P.start)/1000),xp=Math.max(15,50-2*(moves-P.pairs));
        setTimeout(()=>{closePrac();awardXP(xp);showResult("🧩",t("pracDone"),[{l:t("xp"),n:xp,pre:"+",col:"var(--blue)"},{l:t("moves"),n:moves,col:"var(--gold)"}],true)},700);
      }},450);
  }else{
    [a,b].forEach(x=>x.node.classList.add("bad"));
    setTimeout(()=>{[a,b].forEach(x=>{x.node.classList.remove("open","bad")});P.lock=false;sfx("no");updMem()},950);
  }
  updMem();
}
function startSpeed(n){
  const pool=DB[S.track],seen=pool.slice(0,n*PER_STAGE).filter(i=>i[0]==="v"),allV=pool.filter(i=>i[0]==="v");
  const src=seen.length?seen:allV;
  P={kind:"speed",src,allV,qs:shuffle(src),qi:0,score:0,ms:45000,total:45000,last:performance.now()};
  $("pracInfo").textContent="⚡ 0";
  openPrac();renderSpeed();
  P.timer=setInterval(()=>{
    const now=performance.now();P.ms-=now-P.last;P.last=now;
    const bar=$("tbar");if(bar)bar.style.transform=`scaleX(${Math.max(0,P.ms/P.total)})`;
    $("pracBar").style.width=(Math.max(0,P.ms)/P.total*100)+"%";
    if(P.ms<=0)endSpeed();
  },80);
}
function renderSpeed(){
  const b=$("pracBody");b.innerHTML="";
  if(P.qi>=P.qs.length){P.qs=shuffle(P.src);P.qi=0}
  const it=P.qs[P.qi],ans=it[1];
  const wrong=shuffle(P.allV.map(x=>x[1]).filter(x=>x!==ans)).slice(0,3);
  const wrap=el("div","");wrap.style.cssText="width:100%";restart(wrap,"qenter");
  const tm=el("div","timer");const bar=el("b");bar.id="tbar";tm.appendChild(bar);
  const sc=el("div","sbig",String(P.score));sc.style.textAlign="center";sc.style.marginBottom=".6rem";
  const pr=el("div","prompt",mean(it));
  const g=el("div","opts");
  shuffle([ans,...wrong]).forEach((o,i)=>{
    const bt=el("button","opt");bt.style.setProperty("--i",i);bt.append(el("kbd","",String(i+1)),el("span","",o));
    bt.onclick=()=>{
      if(!P)return;
      if(o===ans){P.score++;sfx("ok");happy();speak(ans)}else{P.ms-=3000;sfx("no");sad()}
      $("pracInfo").textContent="⚡ "+P.score;P.qi++;renderSpeed();
    };
    g.appendChild(bt);
  });
  wrap.append(tm,sc,pr,g);b.appendChild(wrap);
  bar.style.transform=`scaleX(${Math.max(0,P.ms/P.total)})`;
}
function endSpeed(){
  if(!P)return;const score=P.score,xp=score*3+5;closePrac();awardXP(xp);
  showResult("⚡",t("speedT"),[{l:t("correctN"),n:score,col:"var(--gold)"},{l:t("xp"),n:xp,pre:"+",col:"var(--blue)"}],true);
}

/* ============ Events ============ */
$("btnMain").onclick=onMain;
$("btnQuit").onclick=()=>{if(confirm(t("quit")))endLesson(false)};
$("pracX").onclick=closePrac;
$("pickX").onclick=closePicker;
$("btnSound").onclick=()=>{S.sound=!S.sound;if(!S.sound&&"speechSynthesis"in window)speechSynthesis.cancel();save();renderHeader()};
$("btnChange").onclick=()=>{$("selLang").value=S.lang;$("selLevel").value=S.track;$("onboard").hidden=false};
$("selLang").onchange=e=>{S.lang=e.target.value;applyLang()};
$("obForm").onsubmit=e=>{
  e.preventDefault();
  S.lang=$("selLang").value;S.track=$("selLevel").value;save();
  $("onboard").hidden=true;applyLang();happy();sfx("win");
};
document.addEventListener("keydown",e=>{
  if(!$("picker").hidden&&e.key==="Escape"){closePicker();return}
  if(!$("prac").hidden){
    if(e.key==="Escape"){closePrac();return}
    if(P&&P.kind==="speed"&&/^[1-4]$/.test(e.key)){const bt=document.querySelectorAll("#pracBody .opt")[+e.key-1];if(bt)bt.click()}
    return;
  }
  if($("lesson").hidden||!L)return;
  if(e.key==="Escape"){$("btnQuit").click();return}
  if(e.key==="Enter"&&!$("btnMain").disabled){e.preventDefault();onMain();return}
  if(L.phase==="answer"&&L.q.options&&/^[1-4]$/.test(e.key)&&e.target.tagName!=="INPUT"){
    const b=document.querySelectorAll("#opts .opt")[+e.key-1];if(b)b.click();
  }
});

/* ============ Boot ============ */
window.addEventListener("load",()=>{
  makeBg();init3D();
  $("selLang").value=S.lang;
  if(!S.track){S.track="A1";$("onboard").hidden=false}
  else $("onboard").hidden=true;
  applyLang();
  setTimeout(happy,900);
});
</script>
